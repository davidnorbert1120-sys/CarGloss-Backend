spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cargloss}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8081

logging:
  level:
    hu.cargloss: DEBUG